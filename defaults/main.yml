---
# GitLab Runner runs the CI/CD jobs of a GitLab instance.
# Project source code URL: https://gitlab.com/gitlab-org/gitlab-runner
#
# This role uses the official GitLab Runner container image (`gitlab/gitlab-runner`),
# and supports the Docker executor only.
# See: https://docs.gitlab.com/runner/install/docker/

gitlab_runner_enabled: true

gitlab_runner_identifier: gitlab-runner
gitlab_runner_base_path: "/{{ gitlab_runner_identifier }}"

# Mounted to `/etc/gitlab-runner` in the container.
# Holds `config.toml` (generated by this role, and containing the runner authentication tokens)
# and `.runner_system_id` (generated by GitLab Runner on its first start).
gitlab_runner_config_path: "{{ gitlab_runner_base_path }}/config"

# renovate: datasource=docker depName=gitlab/gitlab-runner versioning=semver
gitlab_runner_version: 19.4.1

# The user and group that the container runs as, and which own the files this role manages on the host.
gitlab_runner_uid: ""
gitlab_runner_gid: ""

gitlab_runner_container_image: "{{ gitlab_runner_container_image_registry_prefix }}gitlab/gitlab-runner:{{ gitlab_runner_container_image_tag }}"
gitlab_runner_container_image_tag: "v{{ gitlab_runner_version }}"
gitlab_runner_container_image_registry_prefix: "{{ gitlab_runner_container_image_registry_prefix_upstream }}"
gitlab_runner_container_image_registry_prefix_upstream: "{{ gitlab_runner_container_image_registry_prefix_upstream_default }}"
gitlab_runner_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
#
# Only the runner itself is connected to it. The containers of the jobs it runs are started by
# the host's Docker daemon on its default bridge network, unless a runner's `docker_network_mode` says otherwise.
gitlab_runner_container_network: "{{ gitlab_runner_identifier }}"

# Control if the container network is deleted on uninstalling.
gitlab_runner_container_network_deletion_enabled: true

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to let the runner reach a GitLab instance by its container name (see `docs/configuring-gitlab-runner.md`).
gitlab_runner_container_additional_networks: "{{ gitlab_runner_container_additional_networks_auto + gitlab_runner_container_additional_networks_custom }}"
# gitlab_runner_container_additional_networks_auto is reserved for usage by the playbook.
# Your custom networks should go into gitlab_runner_container_additional_networks_custom.
gitlab_runner_container_additional_networks_auto: []
gitlab_runner_container_additional_networks_custom: []

# The path to the Docker daemon's socket on the host, which is mounted into the container.
#
# The runner uses it to start the containers of its jobs, next to (not inside) its own container.
# Access to this socket is equivalent to `root` access on the host.
gitlab_runner_container_docker_socket_path_host: /var/run/docker.sock

# The group which the container runs with (in addition to `gitlab_runner_gid`) to be able to use the Docker socket.
# If empty, it's the group that owns `gitlab_runner_container_docker_socket_path_host`, as found while installing.
gitlab_runner_container_docker_socket_gid: ""

# The size of the container's `/tmp` (a tmpfs, so it uses memory as it fills up).
# GitLab Runner buffers the log of each running job in there, up to the runner's `output_limit` (4 MiB by default),
# so it needs to hold `gitlab_runner_config_concurrent` of them.
gitlab_runner_container_tmp_size: 512m

# Specify how the container publishes GitLab Runner's Prometheus metrics endpoint (tcp/9252 in the container).
# Only relevant if `gitlab_runner_config_metrics_enabled` is `true`.
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:9252"), or empty string to not expose.
gitlab_runner_container_metrics_host_bind_port: ""

# A list of extra arguments to pass to the container (`docker create` command)
gitlab_runner_container_extra_arguments: "{{ gitlab_runner_container_extra_arguments_auto + gitlab_runner_container_extra_arguments_custom }}"
gitlab_runner_container_extra_arguments_auto: []
gitlab_runner_container_extra_arguments_custom: []

# List of systemd services that the GitLab Runner systemd service depends on
gitlab_runner_systemd_required_services_list: "{{ gitlab_runner_systemd_required_services_list_default + gitlab_runner_systemd_required_services_list_auto + gitlab_runner_systemd_required_services_list_custom }}"
gitlab_runner_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
gitlab_runner_systemd_required_services_list_auto: []
gitlab_runner_systemd_required_services_list_custom: []

# List of systemd services that the GitLab Runner systemd service wants
gitlab_runner_systemd_wanted_services_list: "{{ gitlab_runner_systemd_wanted_services_list_default + gitlab_runner_systemd_wanted_services_list_auto + gitlab_runner_systemd_wanted_services_list_custom }}"
gitlab_runner_systemd_wanted_services_list_default: []
gitlab_runner_systemd_wanted_services_list_auto: []
gitlab_runner_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
#
# The container is stopped with SIGQUIT, on which GitLab Runner stops picking up new jobs and waits
# for the running ones to finish. Jobs still running when this time is up are killed and fail.
gitlab_runner_container_stop_grace_time_seconds: 600

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
gitlab_runner_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
gitlab_runner_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
gitlab_runner_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ gitlab_runner_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ gitlab_runner_container_stop_grace_time_seconds }} {{ gitlab_runner_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ gitlab_runner_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ gitlab_runner_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ gitlab_runner_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ gitlab_runner_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ gitlab_runner_identifier }} after {{ gitlab_runner_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

########################################################################
#                                                                      #
# config.toml                                                          #
#                                                                      #
########################################################################

# GitLab Runner reloads `config.toml` on its own when it changes, so changing the settings below
# does not restart the container (and does not interrupt running jobs).
# See: https://docs.gitlab.com/runner/configuration/advanced-configuration/

# The URL of the GitLab instance, used by every runner that doesn't specify its own `url`.
gitlab_runner_config_gitlab_url: ""

# The URL that jobs clone repositories from, used by every runner that doesn't specify its own `clone_url`.
# If empty, jobs clone from the URL that GitLab advertises.
gitlab_runner_config_gitlab_clone_url: ""

# The maximum number of jobs that run at the same time, across all runners.
gitlab_runner_config_concurrent: 4

# How often (in seconds) each runner asks GitLab for new jobs. 0 uses GitLab Runner's default (3 seconds).
gitlab_runner_config_check_interval: 0

# Valid values: debug, info, warn, error, fatal, panic
gitlab_runner_config_log_level: info

# Valid values: runner, text, json
gitlab_runner_config_log_format: runner

# Controls whether GitLab Runner serves Prometheus metrics (on tcp/9252 in the container).
# Unlike the other settings here, it's passed on the command line (GitLab Runner only reads it on startup),
# so changing it restarts the container.
# See `gitlab_runner_container_metrics_host_bind_port` for exposing them.
gitlab_runner_config_metrics_enabled: false

# The runners to configure. Each of them is a runner created in GitLab (in the Admin area, or a group's
# or project's CI/CD settings), where GitLab shows its runner authentication token (`glrt-...`).
# Registering runners with a registration token (`gitlab-runner register`) is not supported.
#
# Every runner uses the Docker executor. Besides `name` and `token`, all keys are optional:
#
# gitlab_runner_runners:
#   - name: docker
#     token: glrt-...
#     # Overrides `gitlab_runner_config_gitlab_url` / `gitlab_runner_config_gitlab_clone_url`
#     url: https://gitlab.example.com
#     clone_url: ""
#     # The maximum number of jobs this runner runs at the same time (0 = no limit besides `concurrent`)
#     limit: 0
#     # The number of concurrent requests for new jobs to GitLab
#     request_concurrency: 2
#     # Environment variables set in every job, e.g. `["FOO=bar"]`
#     environment: []
#     # The image jobs run in, unless they specify their own
#     docker_image: alpine:latest
#     # Run jobs in privileged containers. This is needed for Docker-in-Docker (a `docker:dind` service),
#     # and gives every job `root` access to the host.
#     docker_privileged: false
#     # Volumes mounted into every job container. Bind mounts refer to paths on the host, not in the runner's container.
#     docker_volumes: ["/cache"]
#     # The network that job containers are connected to (empty = Docker's default bridge network)
#     docker_network_mode: ""
#     # Additional TOML settings for the runner's `[runners.docker]` section, e.g. `pull_policy = ["if-not-present"]`
#     docker_configuration_extension_toml: ""
#     # Additional TOML for the runner's `[[runners]]` section (before its `[runners.docker]` section),
#     # e.g. `output_limit = 16384` or a `[runners.cache]` section. Plain keys must come before any section in it.
#     configuration_extension_toml: ""
gitlab_runner_runners: []

# Defaults for the optional keys of `gitlab_runner_runners` items.
gitlab_runner_runners_default_request_concurrency: 2
gitlab_runner_runners_default_docker_image: alpine:latest
gitlab_runner_runners_default_docker_privileged: false
gitlab_runner_runners_default_docker_volumes: ["/cache"]

# Additional TOML settings for the global section of `config.toml` (before the `[[runners]]` sections).
gitlab_runner_configuration_extension_toml: ""

# gitlab_runner_restart_necessary controls whether the GitLab Runner systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# the systemd service file or the container image changed. Changes to `config.toml` alone
# do not need a restart, as GitLab Runner reloads it on its own.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
gitlab_runner_restart_necessary: false
